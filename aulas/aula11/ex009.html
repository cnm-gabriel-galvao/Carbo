<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Nacionalidade</h1>

    <p>Qual é a sua nacionalidade?</p>

    <input
      type="text"
      id="nacionalidade"
      placeholder="Digite sua nacionalidade"
    />
    <button onclick="verificarNacionalidade()">Verificar</button>

    <div id="resultado"></div>

    <script>
      function verificarNacionalidade() {
        var pais = document.getElementById("nacionalidade").value
        var resultado = document.getElementById("resultado")
        if (pais.toLowerCase() === "brasil") {
          resultado.innerHTML = "Você é brasileiro!"
        } else {
          resultado.innerHTML = "Você é estrangeiro!"
        }
      }
    </script>
  </body>
</html>
