<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somando</title>
  </head>
  <body>
    <h1>Somando</h1>
    <input type="number" name="txt1" id="txt1" /> +
    <input type="number" name="txt2" id="txt2" />
    <input type="button" value="Somar" onclick="somar()" />
    <script>
      function somar() {
        var nstr = window.document.getElementById("txt1")
        var nstr2 = window.document.getElementById("txt2")
        var n1 = Number(nstr.value)
        var n2 = Number(nstr2.value)
        var res = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${res}`)
      }
    </script>
  </body>
</html>
